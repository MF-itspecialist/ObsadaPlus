# Uruchomienie:
#   bez Google Maps (trasy z własnego serwera OSRM):  docker compose --profile osrm up --build
#   z kluczem Google Maps (GOOGLE_MAPS_API_KEY w .env): docker compose up --build
# Gotowe skrypty: scripts/start-osrm.(ps1|sh) i scripts/start-google.(ps1|sh).
# Gdy jest klucz Google, backend liczy trasy przez Google; bez klucza przez OSRM;
# gdy żaden serwis nie odpowiada — szacunkowo (linia prosta × współczynnik).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obsada
      POSTGRES_USER: obsada
      POSTGRES_PASSWORD: obsada
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # tylko z tego komputera (hasło jest domyślne)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsada -d obsada"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Podgląd bazy w przeglądarce: http://localhost:8080
  # (System: PostgreSQL, serwer: postgres, użytkownik/hasło/baza: obsada)
  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://obsada:obsada@postgres:5432/obsada
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTO_CREATE_TABLES: "true"
      SEED_ON_STARTUP: "true"
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-auto}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      # Pierwsze konto obsadzającego (tylko gdy w bazie nie ma kont); zwykle tworzy je zadanie z kolejki.
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # API (wymaga logowania) — tylko z tego komputera

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # --- Trasy bez Google: OSRM na mapie OpenStreetMap (profil "osrm") ---------------
  # Za pierwszym razem pobiera mapę regionu (domyślnie woj. mazowieckie, ~150 MB)
  # i przygotowuje ją do liczenia tras (kilka–kilkanaście minut, ok. 2–4 GB RAM).
  # Kolejne uruchomienia korzystają z gotowych plików w wolumenie osrmdata.
  osrm-prepare:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/europe/poland/mazowieckie-latest.osm.pbf}
    volumes:
      - osrmdata:/data
      - ./osrm/prepare.sh:/prepare.sh:ro
    entrypoint: ["/bin/sh", "/prepare.sh"]

  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/region.osrm"]
    volumes:
      - osrmdata:/data
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    ports:
      - "5000:5000"

volumes:
  pgdata:
  osrmdata:
