services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obsada
      POSTGRES_USER: obsada
      POSTGRES_PASSWORD: obsada
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsada -d obsada"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://obsada:obsada@postgres:5432/obsada
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTO_CREATE_TABLES: "true"
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
